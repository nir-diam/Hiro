# Push to main updates the Ubuntu server.
#
# GitHub repo → Settings → Secrets and variables → Actions:
#   SSH_HOST                 server IP or hostname (required)
#   SSH_KEY                  private key whose public key is in /home/ubuntu/.ssh/authorized_keys (required)
#   SSH_USER                 defaults to ubuntu
#   DEPLOY_WEB_ROOT          Nginx folder for app.hiro.co.il (optional if Nginx config names that host)
#   VITE_GOOGLE_MAPS_API_KEY baked into the frontend build
#   VITE_GOOGLE_CLIENT_ID    optional
#   VITE_POSTHOG_KEY         optional
#   GEMINI_API_KEY           baked into the frontend build for in-browser AI calls
#
# The server env files /home/ubuntu/backend/.env and /home/ubuntu/backend/src/.env are never uploaded.

name: Deploy to Ubuntu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DEPLOY_WEB_ROOT: ${{ secrets.DEPLOY_WEB_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci and vite build
        working-directory: frontend
        env:
          VITE_API_BASE: https://api.hiro.co.il
          VITE_CLIENT_JOURNAL_LIST_MIN_GAP_MS: "60000"
          VITE_CLIENT_JOURNAL_LIST_POLL_MS: "60000"
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm ci --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @rollup/rollup-linux-x64-gnu@4.54.0
          npm run build

      - name: Check deploy secrets
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "Add SSH_HOST and SSH_KEY in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          test -n "$SSH_USER" || echo "SSH_USER is empty; using ubuntu."

      - name: Configure SSH
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q "BEGIN" ~/.ssh/deploy_key; then
            echo "SSH_KEY does not look like a private key."
            exit 1
          fi
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          SSH_TARGET="${SSH_USER:-ubuntu}"
          echo "SSH_TARGET=$SSH_TARGET" >> "$GITHUB_ENV"

      - name: Upload backend
        run: |
          rsync -az \
            --exclude node_modules \
            --exclude .env \
            --exclude src/.env \
            --exclude .cache \
            --exclude jwt-private.pem \
            --exclude jwt-public.pem \
            --exclude jwt-keys.json \
            --exclude '*.traineddata' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            backend/ "$SSH_TARGET@$SSH_HOST:/home/ubuntu/backend/"

      - name: Upload frontend build
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_TARGET@$SSH_HOST" "mkdir -p /home/ubuntu/Hiro-frontend-dist"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            frontend/dist/ "$SSH_TARGET@$SSH_HOST:/home/ubuntu/Hiro-frontend-dist/"

      - name: Install, publish, restart
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_TARGET@$SSH_HOST" \
            "DEPLOY_WEB_ROOT=$(printf '%q' "$DEPLOY_WEB_ROOT") bash -s" < scripts/deploy-on-server.sh
